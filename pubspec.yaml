name: keuangan_keluarga_ultimate
description: Aplikasi Keuangan Keluarga Ultimate.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_secure_storage: ^10.3.1
  fl_chart: ^0.65.0
  get_it: ^7.6.4
  uuid: ^4.2.0
  intl: ^0.18.1
  google_fonts: ^6.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#FDFDFD"
  image: assets/images/logo.png

  color_dark: "#0F0F0F"
  image_dark: assets/images/logo.png

  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  color: "#ffffff"
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
